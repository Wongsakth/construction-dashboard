<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR → Excel | TKTD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3147;
    --accent: #4f8ef7;
    --accent2: #38d9a9;
    --text: #e8eaf0;
    --muted: #8890a8;
    --danger: #f66;
    --success: #38d9a9;
    --radius: 10px;
    --font: 'Segoe UI', 'Noto Sans Thai', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
  .header-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .header-sub { font-size: 12px; color: var(--muted); margin-left: auto; }

  /* Layout */
  .main { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 24px 28px; max-width: 1400px; }

  /* Panel */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .panel-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .panel-head .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }
  .panel-body { padding: 18px; }

  /* Drop zone */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    background: var(--surface2);
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(79,142,247,.06); }
  .dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .dropzone-icon { font-size: 36px; margin-bottom: 10px; }
  .dropzone-text { font-size: 14px; color: var(--muted); }
  .dropzone-sub { font-size: 12px; color: var(--muted); margin-top: 6px; opacity: .6; }

  /* File list */
  .file-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .file-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .file-icon { font-size: 18px; }
  .file-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-size { color: var(--muted); font-size: 11px; }
  .file-status { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .status-wait { background: rgba(136,144,168,.15); color: var(--muted); }
  .status-proc { background: rgba(79,142,247,.15); color: var(--accent); }
  .status-done { background: rgba(56,217,169,.15); color: var(--success); }
  .status-err  { background: rgba(255,102,102,.15); color: var(--danger); }
  .file-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .file-remove:hover { color: var(--danger); }

  /* Buttons */
  .btn {
    padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all .15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #6ba3ff; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-success { background: var(--accent2); color: #0f1117; }
  .btn-success:hover:not(:disabled) { background: #5de8bc; }
  .btn-success:disabled { opacity: .4; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

  /* Progress */
  .progress-bar {
    height: 4px; background: var(--border); border-radius: 2px; margin-top: 14px; overflow: hidden;
    display: none;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px; transition: width .3s;
  }

  /* Result preview */
  .result-area {
    margin-top: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: none;
  }
  .result-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .result-tab {
    padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent; transition: all .15s;
  }
  .result-tab.active { color: var(--accent); border-color: var(--accent); }
  .result-content { padding: 12px; max-height: 320px; overflow-y: auto; }
  .result-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .result-table th { background: rgba(79,142,247,.1); color: var(--accent); padding: 6px 10px; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border); }
  .result-table td { padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,.04); color: var(--text); vertical-align: top; }
  .result-table tr:last-child td { border-bottom: none; }
  .raw-text { font-size: 12px; color: var(--muted); white-space: pre-wrap; line-height: 1.6; }

  /* History panel */
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 600px; overflow-y: auto; }
  .history-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-date { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .history-files { font-weight: 600; color: var(--text); }
  .history-count { color: var(--accent2); font-size: 11px; margin-top: 2px; }
  .history-dl { margin-top: 6px; }
  .history-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

  /* Stats */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 18px; font-size: 13px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    transform: translateY(80px); opacity: 0;
    transition: all .3s; z-index: 999;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.ok { border-color: var(--success); color: var(--success); }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  scrollbar-width: thin;
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <span class="logo">TKTD</span>
  <span style="color:var(--border)">|</span>
  <span class="header-title">🔍 OCR → Excel</span>
  <span class="header-sub">แปลงรูปภาพ / PDF เป็น Excel อัตโนมัติด้วย AI</span>
</div>

<div class="main">
  <!-- Left: Main -->
  <div>
    <div class="panel">
      <div class="panel-head"><div class="dot"></div> Import ไฟล์</div>
      <div class="panel-body">
        <div class="dropzone" id="dropzone">
          <input type="file" id="fileInput" multiple accept="image/*,.pdf">
          <div class="dropzone-icon">📂</div>
          <div class="dropzone-text">คลิกเพื่อเลือกไฟล์ หรือลากมาวางที่นี่</div>
          <div class="dropzone-sub">รองรับ JPG, PNG (สูงสุด 5 MB) • PDF (สูงสุด 10 MB) • สูงสุด 5 ไฟล์ • รวมไม่เกิน 20 MB</div>
        </div>

        <div class="file-list" id="fileList"></div>

        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btnProcess" disabled onclick="processFiles()">
            ⚡ เริ่ม OCR
          </button>
          <button class="btn btn-success" id="btnExport" disabled onclick="exportExcel()">
            📥 Export Excel
          </button>
          <button class="btn btn-outline" onclick="clearAll()">🗑 ล้างทั้งหมด</button>
        </div>

        <div class="result-area" id="resultArea">
          <div class="result-tabs" id="resultTabs"></div>
          <div class="result-content" id="resultContent"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: History -->
  <div>
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-label">ไฟล์ทั้งหมด</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statSessions">0</div>
        <div class="stat-label">ครั้งที่ใช้งาน</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div class="dot" style="background:var(--accent2);box-shadow:0 0 6px var(--accent2)"></div> ประวัติการใช้งาน</div>
      <div class="panel-body" style="padding:12px">
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FILES = [];
const RESULTS = {};
let activeTab = 0;

// ── Drag & Drop ──
const dz = document.getElementById('dropzone');
const fi = document.getElementById('fileInput');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); addFiles(e.dataTransfer.files); });
fi.addEventListener('change', () => addFiles(fi.files));

function addFiles(rawFiles) {
  const MAX_IMAGE_MB = 5;
  const MAX_PDF_MB = 10;
  const MAX_TOTAL_MB = 20;
  const MB = 1024 * 1024;

  const allowed = [...rawFiles].filter(f => f.type.startsWith('image/') || f.type === 'application/pdf');

  if (allowed.length === 0) {
    showToast('❌ ไม่รองรับไฟล์ประเภทนี้ — รองรับเฉพาะ JPG, PNG, PDF เท่านั้น', 'err');
    return;
  }

  const slots = 5 - FILES.length;
  if (slots <= 0) {
    showToast('❌ ครบ 5 ไฟล์แล้ว — กรุณาล้างไฟล์เก่าก่อนเพิ่มใหม่', 'err');
    return;
  }

  if (allowed.length > slots) {
    showToast(`⚠️ เลือกได้อีกแค่ ${slots} ไฟล์ — ระบบจะรับเฉพาะ ${slots} ไฟล์แรก`, 'err');
  }

  const errors = [];
  const valid = [];

  for (const f of allowed.slice(0, slots)) {
    const sizeMB = (f.size / MB).toFixed(1);
    const isPdf = f.type === 'application/pdf';
    const limit = isPdf ? MAX_PDF_MB : MAX_IMAGE_MB;

    if (f.size > limit * MB) {
      errors.push(`❌ "${f.name}" ขนาด ${sizeMB} MB — เกินกำหนด (${isPdf ? 'PDF' : 'รูป'}สูงสุด ${limit} MB)`);
      continue;
    }

    const currentTotal = FILES.reduce((s, f) => s + f.file.size, 0);
    const newTotal = currentTotal + valid.reduce((s, f) => s + f.size, 0) + f.size;
    if (newTotal > MAX_TOTAL_MB * MB) {
      errors.push(`❌ "${f.name}" ทำให้ขนาดรวมเกิน ${MAX_TOTAL_MB} MB — ไม่สามารถเพิ่มได้`);
      continue;
    }

    valid.push(f);
  }

  if (errors.length > 0) {
    errors.forEach((msg, i) => setTimeout(() => showToast(msg, 'err'), i * 600));
  }

  if (valid.length === 0) { fi.value = ''; return; }

  valid.forEach(f => FILES.push({ file: f, status: 'wait' }));
  renderFileList();
  document.getElementById('btnProcess').disabled = FILES.length === 0;
  fi.value = '';

  if (valid.length > 0) {
    const totalMB = (FILES.reduce((s, f) => s + f.file.size, 0) / MB).toFixed(1);
    showToast(`✅ เพิ่ม ${valid.length} ไฟล์สำเร็จ — รวม ${totalMB} MB`, 'ok');
  }
}

function renderFileList() {
  const el = document.getElementById('fileList');
  el.innerHTML = FILES.map((f, i) => `
    <div class="file-item" id="fitem-${i}">
      <span class="file-icon">${f.file.type === 'application/pdf' ? '📄' : '🖼️'}</span>
      <span class="file-name">${f.file.name}</span>
      <span class="file-size">${(f.file.size/1024).toFixed(1)} KB${f.file.type === 'application/pdf' ? ' · PDF' : ''}</span>
      <span class="file-status status-${f.status}" id="fstatus-${i}">${statusLabel(f.status)}</span>
      ${f.status === 'wait' ? `<button class="file-remove" onclick="removeFile(${i})">✕</button>` : ''}
    </div>`).join('');
}

function statusLabel(s) {
  return { wait: 'รอดำเนินการ', proc: 'กำลังประมวล...', done: 'สำเร็จ', err: 'ผิดพลาด' }[s] || s;
}

function removeFile(i) {
  FILES.splice(i, 1);
  renderFileList();
  document.getElementById('btnProcess').disabled = FILES.length === 0;
}

function clearAll() {
  FILES.length = 0;
  Object.keys(RESULTS).forEach(k => delete RESULTS[k]);
  renderFileList();
  document.getElementById('btnProcess').disabled = true;
  document.getElementById('btnExport').disabled = true;
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('progressBar').style.display = 'none';
}

// ── OCR ──
async function processFiles() {
  document.getElementById('btnProcess').disabled = true;
  document.getElementById('progressBar').style.display = 'block';

  for (let i = 0; i < FILES.length; i++) {
    if (FILES[i].status === 'done') continue;
    FILES[i].status = 'proc';
    renderFileList();
    setProgress(Math.round((i / FILES.length) * 100));

    try {
      const isPdf = FILES[i].file.type === 'application/pdf';

      if (isPdf) {
        const pages = await pdfToPageImages(FILES[i].file);
        const sheets = [];

        for (let p = 0; p < pages.length; p++) {
          setProgress(Math.round(((i + (p / pages.length)) / FILES.length) * 100));
          const data = await callClaudeOCR(pages[p].base64, false, FILES[i].file.name, 'image/jpeg');
          sheets.push({ label: `หน้า ${p + 1}`, rows: data.rows || [], raw: data.raw || '' });
        }

        const baseName = FILES[i].file.name.replace(/\.[^.]+$/, '');
        RESULTS[i] = { name: FILES[i].file.name, sheets, baseName, rows: sheets.flatMap(s => s.rows.map(r => ({ หน้า: s.label, ...r }))) , raw: sheets.map(s => `--- ${s.label} ---\n${s.raw}`).join('\n\n') };
      } else {
        const b64 = await toBase64(FILES[i].file);
        const data = await callClaudeOCR(b64, false, FILES[i].file.name, FILES[i].file.type);
        RESULTS[i] = { name: FILES[i].file.name, rows: data.rows, raw: data.raw };
      }

      FILES[i].status = 'done';
    } catch(e) {
      FILES[i].status = 'err';
      RESULTS[i] = { name: FILES[i].file.name, rows: [], raw: `Error: ${e.message}` };
    }
    renderFileList();
  }

  setProgress(100);
  setTimeout(() => { document.getElementById('progressBar').style.display = 'none'; }, 800);
  renderResults();
  document.getElementById('btnExport').disabled = false;
  document.getElementById('resultArea').style.display = 'block';
  saveHistory();
  showToast('OCR เสร็จสิ้น! พร้อม Export Excel', 'ok');
}

async function callClaudeOCR(base64, isPdf, filename, fileType) {
  const mimeType = isPdf ? 'application/pdf' : (fileType || 'image/jpeg');

  const res = await fetch('/.netlify/functions/ocr', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ base64, mimeType }),
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || 'OCR failed');
  }

  return await res.json();
}

// ── PDF → pages as images ──
async function pdfToPageImages(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const pages = [];

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    pages.push({ base64, mimeType: 'image/jpeg', label: `หน้า ${i}` });
  }
  return pages;
}

function toBase64(file) {
  return new Promise((res, rej) => {
    // resize image 50%
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * 0.5);
        canvas.height = Math.round(img.height * 0.5);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        res(canvas.toDataURL(file.type, 0.8).split(',')[1]);
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

// ── Results ──
function renderResults() {
  const tabs = document.getElementById('resultTabs');
  const keys = Object.keys(RESULTS);
  activeTab = keys[0];

  tabs.innerHTML = keys.map(k => `
    <div class="result-tab ${k == activeTab ? 'active' : ''}" onclick="switchTab('${k}')" id="tab-${k}">
      ${RESULTS[k].name.slice(0, 18)}${RESULTS[k].name.length > 18 ? '...' : ''}
    </div>`).join('');

  renderTabContent();
}

function switchTab(k) {
  activeTab = k;
  document.querySelectorAll('.result-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${k}`)?.classList.add('active');
  renderTabContent();
}

function renderTabContent() {
  const el = document.getElementById('resultContent');
  const r = RESULTS[activeTab];
  if (!r) return;

  if (r.rows && r.rows.length > 0) {
    const cols = Object.keys(r.rows[0]);
    el.innerHTML = `<table class="result-table">
      <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${r.rows.map(row => `<tr>${cols.map(c => `<td>${row[c] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>`;
  } else {
    el.innerHTML = `<pre class="raw-text">${r.raw || 'ไม่พบข้อมูล'}</pre>`;
  }
}

// ── Export Excel ──
function exportExcel() {
  const wb = window.XLSX.utils.book_new();
  const usedNames = {};

  Object.values(RESULTS).forEach(r => {
    if (r.sheets && r.sheets.length > 0) {
      // PDF: แต่ละหน้าเป็น Sheet แยก
      const baseName = r.baseName || r.name.replace(/\.[^.]+$/, '');
      r.sheets.forEach((sheet, idx) => {
        if (!sheet.rows || sheet.rows.length === 0) return;
        const ws = window.XLSX.utils.json_to_sheet(sheet.rows);
        let sheetName = `${baseName.slice(0, 20)}_P${idx + 1}`;
        if (usedNames[sheetName]) {
          usedNames[sheetName]++;
          sheetName = `${sheetName}_${usedNames[sheetName]}`;
        } else {
          usedNames[sheetName] = 1;
        }
        sheetName = sheetName.slice(0, 31);
        window.XLSX.utils.book_append_sheet(wb, ws, sheetName);
      });
    } else {
      // Image: 1 Sheet ต่อไฟล์
      if (!r.rows || r.rows.length === 0) return;
      const ws = window.XLSX.utils.json_to_sheet(r.rows);
      let sheetName = r.name.replace(/\.[^.]+$/, '').slice(0, 28);
      if (usedNames[sheetName]) {
        usedNames[sheetName]++;
        sheetName = `${sheetName.slice(0, 25)}_${usedNames[sheetName]}`;
      } else {
        usedNames[sheetName] = 1;
      }
      sheetName = sheetName.slice(0, 31);
      window.XLSX.utils.book_append_sheet(wb, ws, sheetName);
    }
  });

  const now = new Date();
  const fname = `OCR_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.xlsx`;
  window.XLSX.writeFile(wb, fname);
  showToast(`Export "${fname}" สำเร็จ`, 'ok');
}

// ── History ──
function saveHistory() {
  const history = JSON.parse(localStorage.getItem('ocr_history') || '[]');
  const entry = {
    id: Date.now(),
    date: new Date().toLocaleString('th-TH'),
    files: Object.values(RESULTS).map(r => r.name),
    rows: Object.values(RESULTS).reduce((s, r) => s + (r.rows?.length || 0), 0),
    data: RESULTS
  };
  history.unshift(entry);
  localStorage.setItem('ocr_history', JSON.stringify(history.slice(0, 50)));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('ocr_history') || '[]');
  const el = document.getElementById('historyList');
  const total = history.reduce((s, h) => s + h.files.length, 0);
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statSessions').textContent = history.length;

  if (history.length === 0) {
    el.innerHTML = '<div class="history-empty">ยังไม่มีประวัติ</div>';
    return;
  }

  el.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="history-date">🕐 ${h.date}</div>
      <div class="history-files">${h.files.slice(0,2).join(', ')}${h.files.length > 2 ? ` +${h.files.length-2}` : ''}</div>
      <div class="history-count">📊 ${h.rows} แถวข้อมูล • ${h.files.length} ไฟล์</div>
      <div class="history-dl">
        <button class="btn btn-outline" style="padding:4px 10px;font-size:11px" onclick="reExport(${h.id})">📥 Export อีกครั้ง</button>
      </div>
    </div>`).join('');
}

function reExport(id) {
  const history = JSON.parse(localStorage.getItem('ocr_history') || '[]');
  const entry = history.find(h => h.id === id);
  if (!entry) return;

  const wb = window.XLSX.utils.book_new();
  Object.values(entry.data).forEach(r => {
    if (!r.rows || r.rows.length === 0) return;
    const ws = window.XLSX.utils.json_to_sheet(r.rows);
    window.XLSX.utils.book_append_sheet(wb, ws, r.name.replace(/\.[^.]+$/, '').slice(0, 31));
  });
  window.XLSX.writeFile(wb, `OCR_History_${id}.xlsx`);
  showToast('Export ประวัติสำเร็จ', 'ok');
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  const duration = type === 'err' ? 4000 : 2500;
  setTimeout(() => t.classList.remove('show'), duration);
}

// Init
renderHistory();
</script>
